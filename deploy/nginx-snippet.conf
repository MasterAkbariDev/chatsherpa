# Add these two blocks to the HTTPS server block of your domain, ABOVE the
# catch-all `location /`. Here the domain is bv.akbaridev.com and the login
# server listens on 127.0.0.1:8091 (set by SERVER_HOST / SERVER_PORT in .env).
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public links are then https://bv.akbaridev.com/chatsherpa/login/... and
# https://bv.akbaridev.com/chatsherpa/connect/... (PUBLIC_BASE_URL in .env).

location = /chatsherpa {
    return 301 https://bv.akbaridev.com/chatsherpa/;
}

location /chatsherpa/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
