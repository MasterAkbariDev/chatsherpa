[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatsherpa"
version = "0.1.0"
description = "Drive AI chat web UIs (ChatGPT, DeepSeek, Grok, Gemini) headlessly with Playwright, using saved cookies/sessions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scalesops" }]
dependencies = [
    "playwright>=1.44",
    "rich>=13.7",
]

[project.optional-dependencies]
server = ["aiohttp>=3.9"]
crypto = ["cryptography>=42.0"]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
chatsherpa = "chatsherpa.cli:main"

[tool.setuptools.packages.find]
include = ["chatsherpa*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
