<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure login</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--ink:#e9ebf0;--soft:#9aa3b2;--teal:#2fc7b4;--good:#4cc488;--coral:#f0725c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.3}}
  header .t{font-weight:600}
  header .t small{display:block;color:var(--soft);font-weight:400;font-size:11.5px}
  header .status{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--soft)}
  .stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:auto;background:#0a0c10;-webkit-overflow-scrolling:touch}
  canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:default;touch-action:none}
  .overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,12,16,.92);backdrop-filter:blur(3px)}
  .overlay.show{display:grid}
  .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:2px solid var(--good);color:var(--good);background:rgba(76,196,136,.15)}
  .mark.bad{border-color:var(--coral);color:var(--coral);background:rgba(240,114,92,.15)}
  .card h2{margin:0;font-size:19px}
  .card p{margin:0;color:var(--soft);max-width:300px}
  .spin{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kbtn{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--line);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
  .kbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  header .status{margin-left:0}
  /* Off-screen field that the phone keyboard attaches to. 16px stops iOS zooming in. */
  /* Controls for the page: navigation and the keys a phone or a mouse user needs. */
  .bar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}
  .bar button{flex:none;font:inherit;font-size:12.5px;color:var(--ink);background:var(--line);border:0;border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:#343b48}
  .bar button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .bar .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
  /* The typing bar: a visible field at the bottom, so the keyboard opens from a tap on it and typing never jumps the page. */
  .typebar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
  /* Hidden until the page has a text box focused. It stays focusable, so a tap on the page can still open the keyboard. */
  .typebar:not(.is-ready){height:1px;padding:0;border:0;opacity:0;overflow:hidden}
  .typebar .field{position:relative;flex:1;min-width:0}
  #kb{width:100%;height:44px;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:999px;padding:0 16px;background:#0f1218;color:var(--ink);font:inherit;font-size:16px;outline:none}
  #kb:focus{border-color:var(--teal)}
  .typebar .ph{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:14px;pointer-events:none}

</style>
</head>
<body>
  <header>
    <span class="dot" id="livedot"></span>
    <span class="t">Secure login <small id="sub">connecting to __PROVIDER__…</small></span>
    <span class="status" id="status">●</span>
    <button type="button" class="kbtn" id="kbtn">Keyboard</button>
  </header>
  <div class="bar" id="bar" role="toolbar" aria-label="Browser controls">
    <button type="button" id="zout" data-zoom="out" title="Zoom out">&minus;</button>
    <button type="button" id="zfit" data-zoom="fit" title="Fit to screen">Fit</button>
    <button type="button" id="zin" data-zoom="in" title="Zoom in">+</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-nav="back" title="Back">&larr; Back</button>
    <button type="button" data-nav="forward" title="Forward">Forward &rarr;</button>
    <button type="button" data-nav="reload" title="Reload">Reload</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-key="a" data-ctrl="1" title="Select all (Ctrl+A)">Select all</button>
    <button type="button" data-key="c" data-ctrl="1" title="Copy">Copy</button>
    <button type="button" data-key="x" data-ctrl="1" title="Cut">Cut</button>
    <button type="button" data-key="v" data-ctrl="1" title="Paste">Paste</button>
    <button type="button" data-key="z" data-ctrl="1" title="Undo">Undo</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-key="Backspace" title="Delete the character before the cursor">Backspace</button>
    <button type="button" data-key="Delete" title="Delete the character after the cursor">Delete</button>
    <button type="button" data-key="Enter" title="Enter">Enter</button>
    <button type="button" data-key="Tab" title="Tab">Tab</button>
    <button type="button" data-key="Escape" title="Escape">Esc</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-key="ArrowLeft" title="Left">&larr;</button>
    <button type="button" data-key="ArrowUp" title="Up">&uarr;</button>
    <button type="button" data-key="ArrowDown" title="Down">&darr;</button>
    <button type="button" data-key="ArrowRight" title="Right">&rarr;</button>
    <button type="button" data-key="Home" title="Start of line">Home</button>
    <button type="button" data-key="End" title="End of line">End</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="screen" width="1280" height="800"></canvas>
    <div class="overlay show" id="overlay">
      <div class="card"><div class="spin"></div><p id="ovtext">Starting secure browser…</p></div>
    </div>
  </div>
<div class="typebar" id="typebar">
  <div class="field">
    <input id="kb" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Type to the page">
    <span class="ph" id="kbph">Type here</span>
  </div>
</div>
<script>
(function(){
  var WSURL="__WSURL__", canvas=document.getElementById("screen"), ctx=canvas.getContext("2d"),
      overlay=document.getElementById("overlay"), ovtext=document.getElementById("ovtext"),
      status=document.getElementById("status"), sub=document.getElementById("sub"),
      livedot=document.getElementById("livedot"), img=new Image(), ws, done=false;

  img.onload=function(){ if(canvas.width!==img.width||canvas.height!==img.height){canvas.width=img.width;canvas.height=img.height;} ctx.drawImage(img,0,0); };

  function connect(){
    ws=new WebSocket(WSURL);
    ws.onopen=function(){status.textContent="● live";status.style.color="var(--teal)";sub.textContent="logging in to __PROVIDER__";hideOverlay();};
    ws.onclose=function(){if(!done){status.textContent="● disconnected";status.style.color="var(--coral)";}};
    ws.onmessage=function(e){
      var m=JSON.parse(e.data);
      if(m.type==="frame"){ img.src="data:image/jpeg;base64,"+m.data; }
      else if(m.type==="focus"){ setEditable(!!m.editable); }
      else if(m.type==="success"){ finish(true); }
      else if(m.type==="failed"||m.type==="error"){ finish(false,m.message); }
    };
  }
  function hideOverlay(){overlay.classList.remove("show");}
  function finish(ok,msg){
    done=true; livedot.style.animation="none"; livedot.style.background=ok?"var(--good)":"var(--coral)";
    overlay.classList.add("show");
    overlay.querySelector(".card").innerHTML=
      '<div class="mark'+(ok?'':' bad')+'">'+(ok?'✓':'⚠')+'</div>'+
      '<h2>'+(ok?'You’re connected':'Login didn’t finish')+'</h2>'+
      '<p>'+(ok?'Session captured securely. You can close this window.':(msg||'The link may have expired. Request a new one.'))+'</p>';
    try{ws.close();}catch(_){}
  }

  // ---- input relay (normalized coords) ----
  function norm(ev){var r=canvas.getBoundingClientRect();return {x:Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))};}
  function send(o){ if(ws&&ws.readyState===1&&!done) ws.send(JSON.stringify(o)); }
  var btn={0:"left",1:"middle",2:"right"};
  // Pointer moves are sent at most about 30 times a second, and the last position is always sent,
  // so a click is never queued behind a flood of moves.
  var lastMove=0, moveTimer=null, movePending=null, MOVE_MS=33;
  function sendMove(p){
    var now=Date.now();
    if(now-lastMove>=MOVE_MS){ lastMove=now; send({t:"move",x:p.x,y:p.y}); return; }
    movePending=p;
    if(!moveTimer){ moveTimer=setTimeout(function(){ moveTimer=null; if(movePending){ var q=movePending; movePending=null; lastMove=Date.now(); send({t:"move",x:q.x,y:q.y}); } }, MOVE_MS-(now-lastMove)); }
  }
  canvas.addEventListener("mousemove",function(e){ sendMove(norm(e)); });
  canvas.addEventListener("mousedown",function(e){e.preventDefault();var p=norm(e);send({t:"down",x:p.x,y:p.y,button:btn[e.button]||"left"});canvas.focus(); if(remoteEditable) kb.focus({preventScroll:true});});
  canvas.addEventListener("mouseup",function(e){var p=norm(e);send({t:"up",x:p.x,y:p.y,button:btn[e.button]||"left"});});
  canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
  canvas.addEventListener("wheel",function(e){e.preventDefault();var p=norm(e);send({t:"wheel",x:p.x,y:p.y,dx:e.deltaX,dy:e.deltaY});},{passive:false});
  canvas.tabIndex=0;

  // Touch: one finger is the mouse. A tap clicks and opens the keyboard; a drag moves or scrolls the page.
  // Zoom: pinch, or the +, - and Fit buttons. Zoomed, one finger pans the picture and a tap still clicks.
  var zoom=1, stage=document.getElementById("stage");
  function applyZoom(z){
    zoom=Math.min(4,Math.max(1,z));
    if(zoom>1){
      stage.style.display="block"; canvas.style.display="block"; canvas.style.margin="auto";
      canvas.style.maxWidth="none"; canvas.style.maxHeight="none"; canvas.style.width=(zoom*100)+"%";
    } else {
      stage.style.display=""; canvas.style.display=""; canvas.style.margin="";
      canvas.style.maxWidth=""; canvas.style.maxHeight=""; canvas.style.width="";
      stage.scrollLeft=0; stage.scrollTop=0;
    }
  }
  document.getElementById("zin").addEventListener("click",function(){ applyZoom(zoom*1.25); });
  document.getElementById("zout").addEventListener("click",function(){ applyZoom(zoom/1.25); });
  document.getElementById("zfit").addEventListener("click",function(){ applyZoom(1); });

  var oneFinger=false, moved=false, startX=0, startY=0, lastX=0, lastY=0;
  var pinching=false, pinchDist=0, pinchZoom=1;
  function fingerGap(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  canvas.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(e.touches.length===2){ pinching=true; oneFinger=false; pinchDist=fingerGap(e.touches); pinchZoom=zoom; return; }
    if(e.touches.length>2) return;
    oneFinger=true; moved=false;
    startX=lastX=e.touches[0].clientX; startY=lastY=e.touches[0].clientY;
    if(zoom===1){ var p=norm(e.touches[0]); send({t:"move",x:p.x,y:p.y}); send({t:"down",x:p.x,y:p.y,button:"left"}); }
  },{passive:false});
  canvas.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(pinching && e.touches.length===2){ applyZoom(pinchZoom*fingerGap(e.touches)/pinchDist); return; }
    if(!oneFinger || e.touches.length!==1) return;
    var t=e.touches[0];
    if(zoom>1){
      if(Math.abs(t.clientX-startX)>8 || Math.abs(t.clientY-startY)>8) moved=true;
      if(moved){ stage.scrollLeft-=(t.clientX-lastX); stage.scrollTop-=(t.clientY-lastY); }
      lastX=t.clientX; lastY=t.clientY;
      return;
    }
    sendMove(norm(t));
  },{passive:false});
  canvas.addEventListener("touchend",function(e){
    e.preventDefault();
    if(pinching){ if(e.touches.length===0) pinching=false; return; }
    if(!oneFinger || e.touches.length>0) return;
    oneFinger=false;
    var t=e.changedTouches[0], p=norm(t);
    if(zoom>1){
      // a tap on the zoomed picture is a click where the finger lifted
      if(!moved){ send({t:"move",x:p.x,y:p.y}); send({t:"down",x:p.x,y:p.y,button:"left"}); send({t:"up",x:p.x,y:p.y,button:"left"}); }
    } else {
      send({t:"up",x:p.x,y:p.y,button:"left"});
    }
    // A tap on a text box on the page opens the keyboard here, straight from the tap (the browser allows it).
    if(remoteEditable) kb.focus({preventScroll:true});
  },{passive:false});

  // Keep the page in the visible area: when the keyboard opens the page shrinks instead of scrolling.
  function fitToViewport(){
    var h=window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.body.style.height=h+"px";
    window.scrollTo(0,0);
  }
  if(window.visualViewport){ window.visualViewport.addEventListener("resize",fitToViewport); window.visualViewport.addEventListener("scroll",fitToViewport); }
  window.addEventListener("resize",fitToViewport);
  fitToViewport();

  // Keys with their modifiers, so Ctrl+A, Shift+arrows and friends reach the page as the person pressed them.
  function withMods(o,e){ o.ctrl=!!(e.ctrlKey); o.meta=!!(e.metaKey); o.alt=!!(e.altKey); o.shift=!!(e.shiftKey); return o; }

  // Phone keyboards send text as input events, not keydown, so the text field below does the typing.
  // Keyboards often rewrite the word they are still building (autocomplete, autocorrect, suggestions),
  // so the field is not sent blindly: `mirror` is what the remote browser has received from this field,
  // and each change sends only the difference. The field holds one space as a sentinel, so Backspace
  // always changes it.
  var kb=document.getElementById("kb"), SENT=" ", mirror="", remoteEditable=false;
  function resetKb(){ kb.value=SENT; mirror=""; try{kb.setSelectionRange(1,1);}catch(_){} syncPh(); }
  function syncPh(){ document.getElementById("kbph").style.display = mirror==="" ? "block" : "none"; }
  function setEditable(on){
    remoteEditable=!!on;
    document.getElementById("typebar").classList.toggle("is-ready", on);
  }
  function openKeyboard(){ resetKb(); kb.focus({preventScroll:true}); }
  // commit: the text has been sent and the bar is cleared. Not while the phone is still composing a word.
  function sync(commit){
    // Compare with what the field showed last time, sentinel included: deleting the sentinel is a Backspace too.
    var prev=SENT+mirror, now=kb.value, p=0;
    while(p<prev.length && p<now.length && prev.charAt(p)===now.charAt(p)) p++;
    for(var i=p;i<prev.length;i++){ send({t:"key",key:"Backspace"}); }
    for(var j=p;j<now.length;j++){ var ch=now.charAt(j); if(ch==="\n") send({t:"key",key:"Enter"}); else send({t:"char",text:ch}); }
    var text=now.charAt(0)===SENT ? now.slice(1) : now;
    if(now.charAt(0)!==SENT){ kb.value=SENT+text; try{kb.setSelectionRange(1,1);}catch(_){} }
    mirror=text;
    if(commit || text.length>200){ resetKb(); }
    syncPh();
  }
  kb.addEventListener("input",function(e){ sync(!(e.isComposing || e.inputType==="insertCompositionText")); });
  kb.addEventListener("compositionend",function(){ sync(true); });
  kb.addEventListener("keydown",function(e){
    if(e.isComposing||done) return;
    if(isPasteKey(e)) return;   // the paste event brings in the text on this device
    if((e.ctrlKey||e.metaKey) && e.key.length===1){
      // A shortcut is the page's, not the text field's: send it and start the field afresh.
      e.preventDefault(); send(withMods({t:"key",key:e.key},e)); resetKb(); return;
    }
    if(e.key==="Enter"||e.key==="Tab"||e.key==="Escape"||e.key.indexOf("Arrow")===0||e.key==="Home"||e.key==="End"){
      e.preventDefault(); send(withMods({t:"key",key:e.key},e)); resetKb();
    }
  });
  // The toolbar: keep focus in the text field, so the phone keyboard stays open.
  document.querySelectorAll("#bar button").forEach(function(b){
    b.addEventListener("pointerdown",function(e){ e.preventDefault(); });
    b.addEventListener("click",function(){
      if(b.dataset.zoom) return;
      if(b.dataset.nav){ send({t:"nav",action:b.dataset.nav}); return; }
      if(b.dataset.key==="v" && b.dataset.ctrl && navigator.clipboard && navigator.clipboard.readText){
        // The toolbar's Paste reads this device's clipboard; the remote clipboard is only a fallback.
        navigator.clipboard.readText().then(pasteText, function(){ send({t:"key",key:"v",ctrl:true}); });
        return;
      }
      send({t:"key",key:b.dataset.key,ctrl:!!b.dataset.ctrl,shift:false,alt:false,meta:false});
      resetKb();
    });
  });
  document.getElementById("kbtn").addEventListener("click",openKeyboard);
  resetKb();

  // Paste brings in the text on this device, so the browser's paste event does it (see "paste" below).
  function isPasteKey(e){ return (e.ctrlKey||e.metaKey) && (e.key==="v"||e.key==="V"); }

  // A paste from this device goes into the remote page as text.
  function pasteText(text){ if(text && !done) send({t:"char",text:text}); }
  document.addEventListener("paste",function(e){
    var data=(e.clipboardData||window.clipboardData);
    var text=data ? data.getData("text") : "";
    if(text){ e.preventDefault(); pasteText(text); }
  });

  window.addEventListener("keydown",function(e){
    if(done || e.target===kb) return;
    if(isPasteKey(e)) return;
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey){ send({t:"char",text:e.key}); e.preventDefault(); }
    else { send(withMods({t:"key",key:e.key},e)); if(e.ctrlKey||e.metaKey||["Tab","Enter","Backspace","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key)>=0) e.preventDefault(); }
  });
  connect();
})();
</script>
</body>
</html>
