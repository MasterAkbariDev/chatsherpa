<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure login</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--ink:#e9ebf0;--soft:#9aa3b2;--teal:#2fc7b4;--good:#4cc488;--coral:#f0725c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.3}}
  header .t{font-weight:600}
  header .t small{display:block;color:var(--soft);font-weight:400;font-size:11.5px}
  header .status{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--soft)}
  .stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;background:#0a0c10}
  canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:default;touch-action:none}
  .hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--soft);background:rgba(0,0,0,.5);padding:5px 12px;border-radius:999px;pointer-events:none}
  .overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,12,16,.92);backdrop-filter:blur(3px)}
  .overlay.show{display:grid}
  .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:2px solid var(--good);color:var(--good);background:rgba(76,196,136,.15)}
  .mark.bad{border-color:var(--coral);color:var(--coral);background:rgba(240,114,92,.15)}
  .card h2{margin:0;font-size:19px}
  .card p{margin:0;color:var(--soft);max-width:300px}
  .spin{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kbtn{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--line);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
  .kbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  header .status{margin-left:0}
  /* Off-screen field that the phone keyboard attaches to. 16px stops iOS zooming in. */
  #kb{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none}
</style>
</head>
<body>
  <header>
    <span class="dot" id="livedot"></span>
    <span class="t">Secure login <small id="sub">connecting to __PROVIDER__…</small></span>
    <span class="status" id="status">●</span>
    <button type="button" class="kbtn" id="kbtn">Keyboard</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="screen" width="1280" height="800"></canvas>
    <div class="hint">One-time, encrypted session. Log in as you normally would — Google / 2FA all work.</div>
    <input id="kb" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Type here to send keys to the browser">
    <div class="overlay show" id="overlay">
      <div class="card"><div class="spin"></div><p id="ovtext">Starting secure browser…</p></div>
    </div>
  </div>
<script>
(function(){
  var WSURL="__WSURL__", canvas=document.getElementById("screen"), ctx=canvas.getContext("2d"),
      overlay=document.getElementById("overlay"), ovtext=document.getElementById("ovtext"),
      status=document.getElementById("status"), sub=document.getElementById("sub"),
      livedot=document.getElementById("livedot"), img=new Image(), ws, done=false;

  img.onload=function(){ if(canvas.width!==img.width||canvas.height!==img.height){canvas.width=img.width;canvas.height=img.height;} ctx.drawImage(img,0,0); };

  function connect(){
    ws=new WebSocket(WSURL);
    ws.onopen=function(){status.textContent="● live";status.style.color="var(--teal)";sub.textContent="logging in to __PROVIDER__";hideOverlay();};
    ws.onclose=function(){if(!done){status.textContent="● disconnected";status.style.color="var(--coral)";}};
    ws.onmessage=function(e){
      var m=JSON.parse(e.data);
      if(m.type==="frame"){ img.src="data:image/jpeg;base64,"+m.data; }
      else if(m.type==="success"){ finish(true); }
      else if(m.type==="failed"||m.type==="error"){ finish(false,m.message); }
    };
  }
  function hideOverlay(){overlay.classList.remove("show");}
  function finish(ok,msg){
    done=true; livedot.style.animation="none"; livedot.style.background=ok?"var(--good)":"var(--coral)";
    overlay.classList.add("show");
    overlay.querySelector(".card").innerHTML=
      '<div class="mark'+(ok?'':' bad')+'">'+(ok?'✓':'⚠')+'</div>'+
      '<h2>'+(ok?'You’re connected':'Login didn’t finish')+'</h2>'+
      '<p>'+(ok?'Session captured securely. You can close this window.':(msg||'The link may have expired. Request a new one.'))+'</p>';
    try{ws.close();}catch(_){}
  }

  // ---- input relay (normalized coords) ----
  function norm(ev){var r=canvas.getBoundingClientRect();return {x:Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))};}
  function send(o){ if(ws&&ws.readyState===1&&!done) ws.send(JSON.stringify(o)); }
  var btn={0:"left",1:"middle",2:"right"};
  canvas.addEventListener("mousemove",function(e){var p=norm(e);send({t:"move",x:p.x,y:p.y});});
  canvas.addEventListener("mousedown",function(e){e.preventDefault();var p=norm(e);send({t:"down",x:p.x,y:p.y,button:btn[e.button]||"left"});canvas.focus();openKeyboard();});
  canvas.addEventListener("mouseup",function(e){var p=norm(e);send({t:"up",x:p.x,y:p.y,button:btn[e.button]||"left"});});
  canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
  canvas.addEventListener("wheel",function(e){e.preventDefault();var p=norm(e);send({t:"wheel",x:p.x,y:p.y,dx:e.deltaX,dy:e.deltaY});},{passive:false});
  canvas.tabIndex=0;

  // Touch: one finger is the mouse. A tap clicks and opens the keyboard; a drag moves or scrolls the page.
  canvas.addEventListener("touchstart",function(e){e.preventDefault();var p=norm(e.touches[0]);send({t:"move",x:p.x,y:p.y});send({t:"down",x:p.x,y:p.y,button:"left"});},{passive:false});
  canvas.addEventListener("touchmove",function(e){e.preventDefault();var p=norm(e.touches[0]);send({t:"move",x:p.x,y:p.y});},{passive:false});
  canvas.addEventListener("touchend",function(e){e.preventDefault();var p=norm(e.changedTouches[0]);send({t:"up",x:p.x,y:p.y,button:"left"});openKeyboard();},{passive:false});

  // Phone keyboards send text as input events, not keydown, so the text field below does the typing.
  // It holds one space as a sentinel, so Backspace always changes it and shows up as a deletion.
  var kb=document.getElementById("kb"), SENT=" ";
  function resetKb(){ kb.value=SENT; try{kb.setSelectionRange(1,1);}catch(_){} }
  function openKeyboard(){ resetKb(); kb.focus({preventScroll:true}); }
  function flush(){
    var v=kb.value; if(v.charAt(0)===SENT) v=v.slice(1);
    for(var i=0;i<v.length;i++){ send({t:"char",text:v.charAt(i)}); }
    resetKb();
  }
  kb.addEventListener("input",function(e){
    if(e.isComposing) return;
    if(e.inputType && e.inputType.indexOf("delete")===0){ send({t:"key",key:"Backspace"}); resetKb(); return; }
    flush();
  });
  kb.addEventListener("compositionend",flush);
  kb.addEventListener("keydown",function(e){
    if(e.isComposing||done) return;
    if(e.key==="Enter"||e.key==="Tab"||e.key==="Escape"||e.key.indexOf("Arrow")===0){ e.preventDefault(); send({t:"key",key:e.key}); }
  });
  document.getElementById("kbtn").addEventListener("click",openKeyboard);
  resetKb();

  window.addEventListener("keydown",function(e){
    if(done || e.target===kb) return;
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey){ send({t:"char",text:e.key}); e.preventDefault(); }
    else { send({t:"key",key:e.key}); if(["Tab","Enter","Backspace","ArrowUp","ArrowDown"].indexOf(e.key)>=0)e.preventDefault(); }
  });
  connect();
})();
</script>
</body>
</html>
